name: Pipeline de datos

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, minuto 17 (evita la congestión del minuto 0)
  workflow_dispatch:       # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la rama de publicación (gh-pages)
        run: |
          git config user.name "nuclearwatch-bot"
          git config user.email "nuclearwatch-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline
        id: pipeline
        working-directory: pipeline
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python run.py --site ../site

      - name: Publicar resultados
        working-directory: site
        run: |
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="nuclearwatch-bot" -c user.email="nuclearwatch-bot@users.noreply.github.com" \
            commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin gh-pages

      - name: Avisar si saltó el interruptor de seguridad
        if: steps.pipeline.outputs.breaker == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh issue list --state open --search 'interruptor de seguridad in:title' --json number -q '.[0].number')" ]; then
            echo "Ya hay un aviso abierto"; exit 0
          fi
          gh issue create --title "Revisar: interruptor de seguridad activado" \
            --body "Varias regiones subieron de nivel a la vez (${{ steps.pipeline.outputs.breaker_regions }}). No se envió ninguna notificación. Lo más probable es un fallo de datos: revisar site/state/health.json y outbox.json."
